name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 静态检查
        run: ruff check . --output-format=github

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        # 刻意不装 [agent]（openai / python-dotenv）：
        # deepseek_agent 对二者都是可选导入，装了反而测不出解耦是否成立
        run: pip install -e ".[dev]"
      - name: 确认无 DeepSeek 凭据
        # 显式守卫：agent 离线测试必须在「真的没有 API Key」的环境下通过
        run: |
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::CI 不应存在 DEEPSEEK_API_KEY，离线测试的意义会被架空"
            exit 1
          fi
          echo "无凭据环境确认通过"
      - name: 运行测试
        env:
          MPLBACKEND: Agg
        run: pytest tests/ -q

  demos:
    name: demo 脚本冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: pip install -e .
      - name: 跑通所有 demo（只验证不崩，不比对数值）
        # 数值基准由 tests/test_demo1_baseline.py 负责；这里只保证示例脚本没有腐烂
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find ecm_pack/examples -mindepth 1 -maxdepth 1 -type d -name 'demo*' ! -name 'demo_old' | sort)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::没有找到任何 demo 目录，路径可能已变更"
            exit 1
          fi
          echo "发现 ${#dirs[@]} 个 demo 目录"
          for d in "${dirs[@]}"; do
            mapfile -t scripts < <(find "$d" -maxdepth 1 -name '*.py' | sort)
            if [ "${#scripts[@]}" -eq 0 ]; then
              echo "::error::$d 下没有 .py 脚本"
              exit 1
            fi
            for f in "${scripts[@]}"; do
              echo "::group::$f"
              python "$f"
              echo "::endgroup::"
            done
          done
